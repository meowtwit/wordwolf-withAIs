<title>月夜のワードウルフ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一画面アプリ。上に村人（プレイヤー）の列、中央に焚き火を囲む会話、下に話しかける欄。月夜の村の一色の世界。 */
:root {
  --night: #0f1b26;
  --night-2: #16283a;
  --night-3: #1e3549;
  --mist: #dfe8ec;
  --mist-dim: #93a8b6;
  --moon: #f3d88b;
  --moon-ink: #241a05;
  --wolf: #e66a5c;
  --pine: #74c7a3;
  --line: #2a465c;
  --c-ai1: #8fb6ff;
  --c-ai2: #ff9fc6;
  --c-ai3: #c3a4ff;
  --c-ai4: #7fd8e6;
  --f-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  --r: 14px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(900px 500px at 85% -120px, #2b4a63 0%, transparent 60%), var(--night);
  color: var(--mist);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.65;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }

.shell { display: flex; flex-direction: column; height: 100%; max-width: 820px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.moon { width: 26px; height: 26px; border-radius: 50%; background: var(--moon); box-shadow: inset -7px -3px 0 0 var(--night), 0 0 18px #f3d88b55; transform: rotate(-20deg); flex: none; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .06em; }
.status { color: var(--mist-dim); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
main { flex: 1; min-height: 0; overflow-y: auto; padding-block: 4px 18px; }

h2 { font-family: var(--f-display); font-weight: 400; font-size: 19px; letter-spacing: .04em; margin: 0 0 10px; text-wrap: balance; }
h3 { font-size: 15px; margin: 0 0 6px; }
.muted { color: var(--mist-dim); font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
label.f { display: block; font-size: 12px; color: var(--mist-dim); margin: 8px 0 4px; letter-spacing: .04em; }
input[type=text], select { width: 100%; padding: 10px 12px; border-radius: 10px; background: var(--night); border: 1px solid var(--line); }
input[type=text]:focus, select:focus { border-color: var(--moon); outline: none; }

.btn { border: 1px solid var(--line); background: var(--night-3); padding: 10px 18px; border-radius: 999px; cursor: pointer; }
.btn:hover { border-color: var(--mist-dim); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.moonlit { background: var(--moon); color: var(--moon-ink); border-color: var(--moon); font-weight: 700; }
.btn.big { padding: 14px 30px; font-size: 17px; }
.btn.small { padding: 5px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--moon); color: var(--moon-ink); font-weight: 700; }

.ai-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ai-card { background: var(--night); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 12px; padding: 12px; min-width: 0; }

/* 村人の列 */
.villagers { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px 10px; position: sticky; top: 0; z-index: 2; background: var(--night); }
.v { flex: 0 0 auto; width: 84px; text-align: center; padding: 8px 4px; border-radius: 12px; border: 1px solid transparent; position: relative; }
.v.speaking { border-color: var(--c); background: var(--night-2); }
.v .face { width: 44px; height: 44px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--night); font-weight: 700; font-size: 16px; }
.v.speaking .face { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent); } }
.v .nm { font-size: 13px; font-weight: 700; }
.v .tg { font-size: 11px; color: var(--mist-dim); }
.v .chk { position: absolute; top: 2px; right: 8px; font-size: 11px; color: var(--pine); }

/* 会話 */
.log { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-end; animation: rise .25s ease; }
.msg .face { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--c); color: var(--night); font-weight: 700; font-size: 13px; }
.bubble { background: var(--night-2); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 8px 13px; max-width: min(78%, 520px); min-width: 0; overflow-wrap: anywhere; }
.bubble .who { font-size: 12px; font-weight: 700; color: var(--c); }
.msg.human { flex-direction: row-reverse; }
.msg.human .bubble { border-radius: 16px 16px 4px 16px; background: #1d3a35; border-color: #2d5a50; }
.msg.typing .bubble { color: var(--mist-dim); }
.dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--mist-dim); margin-right: 3px; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s } .dots i:nth-child(3) { animation-delay: .4s }
@keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
@keyframes rise { from { opacity: .3; transform: translateY(4px) } to { opacity: 1; transform: none } }
.note { text-align: center; font-size: 12px; color: var(--mist-dim); }
.note.ask { color: var(--moon); }

.meter { height: 4px; border-radius: 2px; background: var(--night-3); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--moon); transition: width .4s; }

/* 話しかける欄 */
.composer { border-top: 1px solid var(--line); padding-block: 10px max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.composer form { display: flex; gap: 8px; align-items: center; }
.composer input { flex: 1; min-width: 0; }
.mic { width: 46px; height: 46px; border-radius: 50%; flex: none; border: 1px solid var(--line); background: var(--night-3); cursor: pointer; display: grid; place-items: center; }
.mic svg { width: 20px; height: 20px; fill: var(--mist); }
.mic.on { background: var(--wolf); border-color: var(--wolf); animation: glow 1.2s infinite; --c: var(--wolf); }
.composer .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.hint { font-size: 12px; color: var(--mist-dim); }

/* 公開・投票 */
.cover { text-align: center; padding-block: 36px; }
.word { font-family: var(--f-display); font-size: clamp(38px, 11vw, 66px); color: var(--moon); letter-spacing: .06em; margin: 14px 0; text-shadow: 0 0 30px #f3d88b44; overflow-wrap: anywhere; }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.choice { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--line); cursor: pointer; text-align: left; }
.choice:hover { border-color: var(--moon); }
.choice .face { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--night); font-weight: 700; flex: none; }

/* 結果 */
.verdict { text-align: center; padding-block: 24px; }
.verdict .big { font-family: var(--f-display); font-size: 32px; margin: 4px 0 8px; }
.verdict.wolf .big { color: var(--wolf); }
.verdict.village .big { color: var(--pine); }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--mist-dim); font-weight: 500; }
.wolfmark { color: var(--wolf); font-weight: 700; }
details.mind { background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
details.mind summary { cursor: pointer; }
.step { border-left: 2px solid var(--c); padding: 4px 0 4px 12px; margin-top: 10px; }
.step .meta { font-size: 12px; color: var(--mist-dim); }
.bars { display: grid; grid-template-columns: 64px 1fr 38px; gap: 3px 8px; align-items: center; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.bar { height: 7px; border-radius: 4px; background: var(--night-3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c); }
.thought { font-size: 13px; margin-top: 4px; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mist-dim); }
.err { color: var(--wolf); font-size: 14px; }
.banner { border: 1px solid var(--line); border-left: 3px solid var(--moon); border-radius: 10px; padding: 10px 12px; font-size: 14px; background: var(--night-2); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<div class="shell">
  <header class="top">
    <div class="brand"><div class="moon" aria-hidden="true"></div><h1>月夜のワードウルフ</h1></div>
    <div class="status" id="status"></div>
  </header>
  <main id="main" aria-live="polite"></main>
  <div id="dock"></div>
</div>

<script>
'use strict';
// ===== データ =====
const TOPICS = [[["海",["波","砂浜","潮の香り","貝殻","水平線","日焼け","夏"]],["プール",["塩素","飛び込み台","ゴーグル","学校の授業","25メートル","屋内","夏"]]],[["カレー",["スパイス","ナン","辛口","福神漬け","給食","ご飯","煮込む"]],["シチュー",["ホワイトソース","牛乳","冬","パン","クリーミー","ご飯","煮込む"]]],[["犬",["散歩","尻尾を振る","ワンワン","忠実","ドッグフード","ペット","リード"]],["猫",["気まぐれ","ニャー","肉球","こたつ","爪とぎ","ペット","マイペース"]]],[["コーヒー",["苦い","カフェイン","豆","ブラック","眠気覚まし","朝","温かい"]],["紅茶",["茶葉","ミルクティー","イギリス","ティーバッグ","レモン","朝","温かい"]]],[["新幹線",["駅弁","速い","指定席","出張","東京駅","旅行","窓際"]],["飛行機",["空港","離陸","機内食","シートベルト","パスポート","旅行","窓際"]]],[["映画館",["ポップコーン","大きなスクリーン","チケット","予告編","暗い","座席","デート"]],["遊園地",["ジェットコースター","観覧車","パレード","行列","チケット","着ぐるみ","デート"]]],[["夏休み",["宿題","花火","セミ","自由研究","ラジオ体操","長い休み","旅行"]],["冬休み",["お年玉","こたつ","大掃除","年賀状","雪","長い休み","旅行"]]],[["ラーメン",["スープ","チャーシュー","替え玉","すする","屋台","麺","熱い"]],["うどん",["讃岐","コシ","だし","天ぷら","太い","麺","熱い"]]],[["スマートフォン",["アプリ","タッチパネル","充電","自撮り","ポケット","画面","通知"]],["パソコン",["キーボード","マウス","仕事","デスク","プログラミング","画面","通知"]]],[["サッカー",["ゴール","ワールドカップ","ボールを蹴る","オフサイド","11人","ボール","チーム"]],["バスケットボール",["ゴール","ダンク","ドリブル","体育館","5人","ボール","チーム"]]],[["図書館",["静か","貸出","返却期限","本棚","勉強","本","無料"]],["本屋",["新刊","立ち読み","レジ","ブックカバー","雑誌","本","買う"]]],[["桜",["お花見","春","ピンク","入学式","散る","花","木"]],["紅葉",["秋","赤","もみじ狩り","落ち葉","京都","葉っぱ","木"]]],[["ケーキ",["誕生日","生クリーム","いちご","ろうそく","ケーキ屋","甘い","デザート"]],["アイスクリーム",["冷たい","コーン","溶ける","夏","バニラ","甘い","デザート"]]],[["温泉",["露天風呂","浴衣","硫黄","旅館","湯けむり","お風呂","リラックス"]],["銭湯",["富士山の絵","コーヒー牛乳","番台","近所","安い","お風呂","リラックス"]]],[["ピアノ",["鍵盤","発表会","ショパン","グランド","白と黒","楽器","練習"]],["ギター",["弦","ピック","バンド","アコースティック","弾き語り","楽器","練習"]]],[["お寿司",["回転","わさび","マグロ","醤油","職人","和食","ご飯"]],["おにぎり",["海苔","梅干し","お弁当","コンビニ","握る","和食","ご飯"]]],[["雪",["雪だるま","白い","スキー","冬","積もる","寒い","空から降る"]],["雨",["傘","梅雨","水たまり","長靴","雷","濡れる","空から降る"]]],[["動物園",["ライオン","キリン","檻","エサやり","遠足","動物","入園料"]],["水族館",["イルカショー","水槽","ペンギン","クラゲ","薄暗い","動物","入園料"]]],[["目覚まし時計",["アラーム","朝","スヌーズ","寝坊","枕元","時間","音"]],["腕時計",["手首","ベルト","おしゃれ","電池","ブランド","時間","身につける"]]],[["ハンバーガー",["ポテト","バンズ","ドライブスルー","ファストフード","パティ","パン","手で持つ"]],["サンドイッチ",["食パン","たまご","ピクニック","三角","ハム","パン","手で持つ"]]]];
const PERSONALITIES = {
  analyst: { label: '慎重・分析型', prompt: '慎重で論理的。発言の矛盾を静かに指摘する。自分からは情報を出しすぎない。' },
  questioner: { label: '積極・質問型', prompt: '好奇心旺盛。他の人に具体的な質問をぶつけて反応を探る。' },
  trickster: { label: '直感・攪乱型', prompt: '直感で動き、ときどき場をかき回す。わざと曖昧なことを言ったり、意外な人を疑ったりする。' },
  cheerful: { label: '陽気・天然型', prompt: '明るくおしゃべりで、思ったことをすぐ口にするが意外と鋭い。' },
  cynic: { label: '皮肉屋', prompt: '少し皮肉っぽく人の発言を疑ってかかるが、根拠はちゃんと言う。' },
};
const AI_PRESETS = [
  { name: 'ハル', personality: 'analyst' },
  { name: 'ミオ', personality: 'questioner' },
  { name: 'ソラ', personality: 'trickster' },
  { name: 'レン', personality: 'cheerful' },
];
const TIERS = { quick: 'すばやい', default: 'じっくり' };
const LENGTHS = { 12: '短め', 18: 'ふつう', 26: '長め' };
const VOICE_PITCH = [1.0, 1.35, 0.8, 1.15];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const $ = (s, el = document) => el.querySelector(s);
const rand = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rand(a.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 保存できなくても遊べる */ } },
};
function toHira(s) { return String(s).replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function normWord(w) { return toHira(String(w || '').normalize('NFKC').replace(/[\s「」『』"'。、.!！?？]/g, '')).toLowerCase(); }
function hintsFor(word) { for (const p of TOPICS) for (const [w, h] of p) if (w === word) return h; return []; }

// ===== 状態 =====
const defaultSetup = () => ({
  humans: 1, names: ['あなた', 'ゲスト'], length: 18, voice: true,
  ais: AI_PRESETS.slice(0, 3).map((a) => ({ ...a, tier: 'quick' })),
});
let setup = store.get('ww-setup-v1', null) || defaultSetup();
if (!Array.isArray(setup.ais) || !setup.ais.length) setup = defaultSetup();

let S = { screen: 'setup', g: null, ui: {} }; // g = ゲーム状態, ui = 画面だけの状態
let sample = null;      // Claude 呼び出し（使えなければ null → オフラインAI）
let aiOffline = false;  // 許可されなかった等でオフラインに切り替えたか
let aiNotice = '';

// ===== 読み上げ =====
const tts = {
  voices: [],
  ok: 'speechSynthesis' in window,
  load() { if (!this.ok) return; const v = speechSynthesis.getVoices().filter((x) => /^ja/i.test(x.lang)); if (v.length) this.voices = v; },
  unlock() { if (!this.ok) return; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch {} },
  say(text, idx) {
    if (!this.ok || !S.g?.voice) return Promise.resolve();
    return new Promise((res) => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        if (this.voices.length) u.voice = this.voices[idx % this.voices.length];
        u.pitch = VOICE_PITCH[idx % VOICE_PITCH.length]; u.rate = 1.12;
        const t = setTimeout(res, 2500 + text.length * 260);
        u.onend = u.onerror = () => { clearTimeout(t); res(); };
        speechSynthesis.speak(u);
      } catch { res(); }
    });
  },
  stop() { if (this.ok) try { speechSynthesis.cancel(); } catch {} },
};
if (tts.ok) { tts.load(); speechSynthesis.onvoiceschanged = () => tts.load(); }

// ===== 音声入力 =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = { rec: null, on: false, blocked: !SR };

// ===== プレイヤー =====
const P = (id) => S.g.players.find((p) => p.id === id);
const humans = () => S.g.players.filter((p) => p.type === 'human');
const ais = () => S.g.players.filter((p) => p.type === 'ai');
function colorOf(p) { return p.type === 'human' ? 'var(--pine)' : `var(--c-${p.id})`; }
function face(p, cls = 'face') { return `<div class="${cls}" style="--c:${colorOf(p)}">${esc([...p.name][0])}</div>`; }

function newGame() {
  const pair = pick(TOPICS);
  const [maj, min] = Math.random() < 0.5 ? [pair[0], pair[1]] : [pair[1], pair[0]];
  const players = [
    ...setup.names.slice(0, setup.humans).map((n, i) => ({ id: `h${i + 1}`, type: 'human', name: (n || `プレイヤー${i + 1}`).trim().slice(0, 10) })),
    ...setup.ais.map((a, i) => ({ id: `ai${i + 1}`, type: 'ai', idx: i, name: (a.name || AI_PRESETS[i].name).trim().slice(0, 10), personality: a.personality, tier: a.tier })),
  ];
  const wolf = pick(players).id;
  for (const p of players) p.word = p.id === wolf ? min[0] : maj[0];
  return {
    players, wolfId: wolf, topic: { majority: maj[0], minority: min[0] },
    log: [], memory: {}, thoughts: Object.fromEntries(players.filter((p) => p.type === 'ai').map((p) => [p.id, []])),
    limit: Number(setup.length), voice: setup.voice,
    voteRound: 0, candidates: [], votes: {}, voteHistory: [], result: null,
  };
}

// ===== AI への見せ方（自分のお題と公開情報だけ） =====
function viewFor(p) {
  const g = S.g;
  return {
    self: { id: p.id, name: p.name, word: p.word, personality: p.personality },
    players: g.players.map((x) => ({ id: x.id, name: x.name, human: x.type === 'human' })),
    log: g.log.map((l) => ({ id: l.id, name: P(l.id).name, text: l.text })),
    memory: g.memory[p.id] || null,
    left: Math.max(0, g.limit - g.log.length),
  };
}
function rulesText(v) {
  const per = PERSONALITIES[v.self.personality] || PERSONALITIES.analyst;
  return `あなたはワードウルフの参加者「${v.self.name}」として遊んでいます。
ルール: 全員にお題（単語）が配られる。多数派は同じお題、1人だけ「ウルフ」が似ているが違うお題を持つ。誰がウルフかは誰にも知らされず、あなた自身がウルフの可能性もある。会話の後に投票し、最多票の人が追放される。ウルフが追放されれば多数派の勝ち。ただしウルフは多数派のお題を当てれば逆転勝利。
あなたのお題: 「${v.self.word}」 （この単語そのものは絶対に言わない）
あなたの性格: ${per.label}。${per.prompt}
参加者: ${v.players.map((x) => `${x.name}(id:${x.id}${x.human ? '・人間' : ''})`).join('、')}
会話:
${v.log.length ? v.log.map((l) => `${l.name}: ${l.text}`).join('\n') : '（まだ誰も話していない）'}
あなたの前回の推理（非公開）: ${v.memory ? `${v.memory.strategy} / 疑い度 ${JSON.stringify(v.memory.suspicions)}` : 'なし'}`;
}
function others(v) { return v.players.filter((x) => x.id !== v.self.id).map((x) => x.id); }
function cleanSusp(raw, v) {
  const ids = others(v); const o = {}; let sum = 0;
  for (const id of ids) { const n = Number(raw?.[id]); o[id] = Number.isFinite(n) && n > 0 ? Math.min(n, 1) : 0; sum += o[id]; }
  for (const id of ids) o[id] = sum ? Math.round((o[id] / sum) * 100) / 100 : Math.round(100 / ids.length) / 100;
  return o;
}
const clip = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };

async function askClaude(p, prompt) {
  const opts = { modelTier: p.tier === 'default' ? 'default' : 'quick', cache: false };
  if (p.tier === 'default') opts.effort = 'low';
  return sample.json(prompt, opts);
}
function handleSampleError(e) {
  const code = e?.code;
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
    aiOffline = true; aiNotice = 'Claudeを使えないため、AIはオフライン（簡易）モードで話します。';
  } else if (code === 'rate_limited') {
    aiNotice = '呼び出しが多すぎると言われました。少し間をあけると元に戻ります（その間は簡易モード）。';
  }
  return code || 'error';
}
const useClaude = () => sample && !aiOffline;

async function aiSpeak(p) {
  const v = viewFor(p);
  if (useClaude()) {
    try {
      const out = await askClaude(p, `${rulesText(v)}

あなたの番です。直前の発言に自然に反応しながら、会話として話してください。
- 日本語の話し言葉で1〜2文、50文字程度まで。性格に合った口調で。誰かに話しかけるときは名前で呼ぶ。
- 具体的すぎるとウルフにお題がばれ、曖昧すぎると自分が疑われる。
- 他の人の話が自分のお題とかみ合わなければ、自分がウルフかもしれないと考えて周りに合わせる。
- 残りの発言回数の目安: ${v.left}
次のJSONだけを返す:
{"speech":"発言","to":"話しかけた相手のid（いなければnull）","suspicions":{${others(v).map((id) => `"${id}":0.0`).join(',')}},"strategy":"次の狙い（短く・非公開）","wolf_self":0.0}
suspicionsは各参加者がウルフだと思う度合い（合計1）。wolf_selfは自分がウルフだと思う確率。`);
      let speech = clip(out?.speech, 90);
      if (!speech) throw { code: 'empty' };
      speech = speech.split(p.word).join('〇〇');
      return { speech, to: typeof out.to === 'string' && v.players.some((x) => x.id === out.to) ? out.to : null,
        suspicions: cleanSusp(out.suspicions, v), strategy: clip(out.strategy, 120), wolfSelf: Math.max(0, Math.min(1, Number(out.wolf_self) || 0)), source: 'claude' };
    } catch (e) {
      const code = handleSampleError(e);
      return { ...offlineSpeak(v), source: 'fallback', error: code };
    }
  }
  return { ...offlineSpeak(v), source: 'offline' };
}

async function aiVote(p, candidates) {
  const v = viewFor(p);
  const valid = candidates.filter((id) => id !== p.id);
  if (useClaude()) {
    try {
      const out = await askClaude(p, `${rulesText(v)}

会話は終わりました。投票の時間です。ウルフだと思う人を次の候補から1人選んでください（自分以外）: ${valid.join(', ')}
次のJSONだけを返す: {"vote":"候補のid","reason":"理由を1文で","suspicions":{${others(v).map((id) => `"${id}":0.0`).join(',')}}}`);
      const vote = String(out?.vote || '').trim();
      if (!valid.includes(vote)) throw { code: 'bad_vote' };
      return { vote, reason: clip(out.reason, 120), suspicions: cleanSusp(out.suspicions, v), source: 'claude' };
    } catch (e) {
      return { ...offlineVote(v, valid), source: 'fallback', error: handleSampleError(e) };
    }
  }
  return { ...offlineVote(v, valid), source: 'offline' };
}

async function aiGuess(p) {
  const v = viewFor(p);
  if (useClaude()) {
    try {
      const out = await askClaude(p, `${rulesText(v)}

あなたはウルフとして追放されました。あなたのお題「${p.word}」は少数派でした。会話から多数派のお題を推理してください。
次のJSONだけを返す: {"guess":"多数派のお題（単語）","reason":"理由を1文で"}`);
      if (!out?.guess) throw { code: 'empty' };
      return { guess: clip(out.guess, 20), reason: clip(out.reason, 120), source: 'claude' };
    } catch (e) { handleSampleError(e); }
  }
  return offlineGuess(v);
}

// ===== オフライン（簡易）AI：自分のお題の連想語だけで判断 =====
function offlineSusp(v) {
  const hints = hintsFor(v.self.word); const raw = {};
  for (const id of others(v)) {
    const lines = v.log.filter((l) => l.id === id).map((l) => l.text);
    const hit = lines.reduce((n, t) => n + hints.filter((h) => t.includes(h)).length, 0);
    raw[id] = (lines.length ? 1 / (1 + hit * 1.5) : 0.5) + Math.random() * 0.25;
  }
  return cleanSusp(raw, v);
}
function offlineSpeak(v) {
  const s = offlineSusp(v);
  const top = Object.entries(s).sort((a, b) => b[1] - a[1])[0]?.[0];
  const said = v.log.filter((l) => l.id === v.self.id).map((l) => l.text).join(' ');
  const hs = hintsFor(v.self.word).filter((h) => !said.includes(h));
  const h = hs.length ? pick(hs) : 'それ';
  const name = v.players.find((x) => x.id === top)?.name;
  const lines = [`${h}って、けっこう関係ある気がするんだよね。`, `わたしは${h}のイメージが強いかな。`, `${h}を思い浮かべる人、多いんじゃない？`];
  const ask = v.log.length > 3 && name && Math.random() < 0.45;
  return { speech: ask ? `${name}さん、さっきの話もうちょっと詳しく聞きたいな。` : pick(lines), to: ask ? top : null, suspicions: s, strategy: `連想語が少ない${name || '誰か'}を警戒`, wolfSelf: 0.3 };
}
function offlineVote(v, valid) {
  const s = offlineSusp(v);
  const vote = valid.slice().sort((a, b) => (s[b] ?? 0) - (s[a] ?? 0))[0];
  return { vote, reason: `${v.players.find((x) => x.id === vote)?.name}さんの話が、自分のお題と一番かみ合わなかった`, suspicions: s };
}
function offlineGuess(v) {
  const text = v.log.filter((l) => l.id !== v.self.id).map((l) => l.text).join(' ');
  let best = { w: v.self.word, n: -1 };
  for (const p of TOPICS) for (const [w, h] of p) { if (w === v.self.word) continue; const n = h.filter((x) => text.includes(x)).length; if (n > best.n) best = { w, n }; }
  return { guess: best.w, reason: '他の人の話に出てきた言葉から連想した', source: 'offline' };
}

// ===== 会話の進行 =====
// 人が話す（または「聞く」を押す）たびに、AIが最大2人まで続けて返事をする。
const talk = { running: false, budget: 0, hint: null, speaking: Promise.resolve(), askedHuman: null };

function record(p, kind, out) {
  const t = { kind, at: S.g.log.length, suspicions: out.suspicions, strategy: out.strategy || out.reason || '', wolfSelf: out.wolfSelf, source: out.source, error: out.error };
  S.g.thoughts[p.id].push(t);
  S.g.memory[p.id] = { suspicions: out.suspicions, strategy: t.strategy };
}
function addressed(text) {
  const t = toHira(text);
  return ais().find((p) => t.includes(toHira(p.name)))?.id || null;
}
function chooseNext() {
  const last = S.g.log[S.g.log.length - 1]?.id;
  if (talk.hint && talk.hint !== last && P(talk.hint)?.type === 'ai') { const h = talk.hint; talk.hint = null; return P(h); }
  talk.hint = null;
  const pool = ais().filter((p) => p.id !== last);
  const count = (p) => S.g.log.filter((l) => l.id === p.id).length;
  const min = Math.min(...pool.map(count));
  return pick(pool.filter((p) => count(p) <= min + 1 && (count(p) === min || Math.random() < 0.35)));
}
function humanSays(hid, text) {
  text = clip(text, 120);
  if (!text || S.screen !== 'talk') return;
  S.g.log.push({ id: hid, text });
  talk.askedHuman = null;
  appendMsg(S.g.log[S.g.log.length - 1]);
  talk.hint = addressed(text);
  talk.budget = 2;
  pump();
}
function listen() { talk.budget = 2; talk.askedHuman = null; pump(); }

async function pump() {
  if (talk.running) { updateDock(); return; }
  talk.running = true; updateDock();
  try {
    while (talk.budget > 0 && S.screen === 'talk' && S.g.log.length < S.g.limit) {
      talk.budget--;
      const sp = chooseNext();
      showTyping(sp);
      const out = await aiSpeak(sp);
      await talk.speaking;
      if (S.screen !== 'talk') break;
      showTyping(null);
      record(sp, 'speech', out);
      S.g.log.push({ id: sp.id, text: out.speech });
      appendMsg(S.g.log[S.g.log.length - 1]);
      talk.speaking = tts.say(out.speech, sp.idx);
      if (out.to && P(out.to)?.type === 'human') { talk.askedHuman = out.to; talk.budget = 0; }
      else if (out.to) talk.hint = out.to;
    }
  } finally {
    talk.running = false; showTyping(null); updateDock();
  }
  if (S.screen === 'talk' && S.g.log.length >= S.g.limit) {
    await talk.speaking;
    note('話す時間が終わりました。投票に移ります。');
    setTimeout(() => startVoting(S.g.players.map((p) => p.id)), 1400);
  }
}

// ===== 投票・判定 =====
function startVoting(candidates) {
  tts.stop(); stopMic();
  Object.assign(S.g, { voteRound: S.g.voteRound + 1, candidates, votes: {} });
  S.screen = 'vote'; S.ui.voteShown = false; S.ui.busy = false;
  render();
}
async function humanVote(hid, target) {
  S.g.votes[hid] = { target, reason: '' };
  S.ui.voteShown = false;
  if (humans().some((h) => !S.g.votes[h.id])) return render();
  S.ui.busy = true; render();
  const res = await Promise.all(ais().map((p) => aiVote(p, S.g.candidates)));
  ais().forEach((p, i) => { S.g.votes[p.id] = { target: res[i].vote, reason: res[i].reason }; record(p, 'vote', res[i]); });
  S.ui.busy = false;
  await tally();
}
async function tally() {
  const g = S.g; const counts = {};
  for (const v of Object.values(g.votes)) counts[v.target] = (counts[v.target] || 0) + 1;
  const max = Math.max(...Object.values(counts));
  const top = Object.keys(counts).filter((id) => counts[id] === max);
  g.voteHistory.push({ round: g.voteRound, votes: { ...g.votes }, counts });
  if (top.length > 1) {
    if (g.voteRound === 1) { S.ui.runoffNote = true; return startVoting(top); }
    return finish({ expelled: null, winner: 'wolf', reason: '決選投票でも同票。誰も追放されず、ウルフが逃げ切りました。' });
  }
  const out = top[0];
  if (out !== g.wolfId) return finish({ expelled: out, winner: 'wolf', reason: `${P(out).name}さんは多数派でした。ウルフの勝ちです。` });
  const wolf = P(g.wolfId);
  if (wolf.type === 'human') { S.screen = 'guess'; return render(); }
  S.screen = 'guess'; S.ui.busy = true; render();
  const gs = await aiGuess(wolf);
  resolveGuess(gs.guess, gs.reason);
}
function resolveGuess(guess, reason = '') {
  const ok = normWord(guess) === normWord(S.g.topic.majority);
  finish({ expelled: S.g.wolfId, winner: ok ? 'wolf' : 'village',
    reason: ok ? 'ウルフは追放されたけれど、多数派のお題を当てて逆転勝利！' : 'ウルフを追放し、逆転も防ぎました。',
    guess: { text: guess, reason, ok } });
}
function finish(result) { S.g.result = result; S.screen = 'result'; S.ui.busy = false; render(); }

  if (!S.ui.started) { S.ui.started = true; note('焚き火を囲んで、AIから話し始めます。'); talk.budget = 2; pump(); }
}
// confirm() はこの画面では使えないので、ボタンの二度押しで確認する
let confirmArmed = 0;
function confirmBox(msg) {
  if (Date.now() - confirmArmed < 4000) { confirmArmed = 0; return true; }
  confirmArmed = Date.now(); dockMsg(`${msg} もう一度押すと進みます。`); return false;
}
function renderVillagers() {
  const el = $('#villagers'); if (!el) return;
  el.innerHTML = S.g.players.map((p) => `<div class="v ${S.ui.typing === p.id ? 'speaking' : ''}" style="--c:${colorOf(p)}">${face(p)}<div class="nm">${esc(p.name)}</div><div class="tg">${p.type === 'human' ? '人間' : esc(PERSONALITIES[p.personality]?.label || '')}</div></div>`).join('');
}
function appendMsg(l, instant) {
  const log = $('#log'); if (!log) return;
  const p = P(l.id);
  const d = document.createElement('div');
  d.className = `msg ${p.type}`; d.style.setProperty('--c', colorOf(p));
  d.innerHTML = `${face(p)}<div class="bubble"><div class="who">${esc(p.name)}</div><span></span></div>`;
  d.querySelector('.bubble span').textContent = l.text;
  log.appendChild(d);
  if (!instant) scrollDown();
}
function note(text, cls = '') { const log = $('#log'); if (!log) return; const d = document.createElement('div'); d.className = `note ${cls}`; d.textContent = text; log.appendChild(d); scrollDown(); }
function showTyping(p) {
  S.ui.typing = p?.id || null; renderVillagers();
  $('#typing')?.remove();
  if (!p) return;
  const d = document.createElement('div');
  d.id = 'typing'; d.className = 'msg typing'; d.style.setProperty('--c', colorOf(p));
  d.innerHTML = `${face(p)}<div class="bubble"><div class="who"></div><span class="dots"><i></i><i></i><i></i></span></div>`;
  d.querySelector('.who').textContent = p.name;
  $('#log').appendChild(d); scrollDown();
}
function scrollDown() { main.scrollTo({ top: main.scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
function dockMsg(t, cls = 'hint') { const el = $('#dockmsg'); if (el) { el.className = cls; el.textContent = t; } }
function updateDock() {
  if (S.screen !== 'talk' || !$('#meter')) return;
  const g = S.g;
  $('#meter').style.width = `${Math.min(100, (g.log.length / g.limit) * 100)}%`;
  statusEl.textContent = `発言 ${g.log.length} / ${g.limit}`;
  $('#listen').disabled = talk.running;
  $('#tovote').disabled = g.log.length < g.players.length;
  const hs = humans();
  $('#who').innerHTML = hs.length > 1 ? `<span class="hint">話す人</span><div class="seg">${hs.map((h) => `<button type="button" data-sp="${h.id}" aria-pressed="${S.ui.speaker === h.id}">${esc(h.name)}</button>`).join('')}</div>` : '';
  $('#who').querySelectorAll('[data-sp]').forEach((b) => b.onclick = () => { S.ui.speaker = b.dataset.sp; updateDock(); });
  if (aiNotice) dockMsg(aiNotice, 'banner');
  else if (talk.askedHuman) dockMsg(`${P(talk.askedHuman).name}さんに話しかけています。答えてあげてください。`, 'note ask');
  else if (talk.running) dockMsg('AIが話しています。途中で話しかけても大丈夫です。');
  else dockMsg(`話しかけるか、「AIの話を聞く」を押してください。`);
}
function peek() {
  const hs = humans();
  const h = hs.find((x) => x.id === S.ui.speaker) || hs[0];
  dockMsg(`${h.name}さんのお題: 「${h.word}」（5秒で消えます）`, 'banner');
  setTimeout(() => updateDock(), 5000);
}

// --- 音声入力 ---
function toggleMic() { mic.on ? stopMic() : startMic(); }
function startMic() {
  if (!SR || mic.on) return;
  tts.stop();
  const rec = new SR();
  rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = false;
  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    const box = $('#text'); if (box) box.value = finalText + interim;
  };
  rec.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
      mic.blocked = true;
      const m = $('#mic'); if (m) m.hidden = true;
      const h = $('#mhint'); if (h) h.textContent = 'この画面ではマイクを使えませんでした。スマホならキーボードのマイクボタンで音声入力できます。';
    }
  };
  rec.onend = () => {
    mic.on = false; $('#mic')?.classList.remove('on');
    const t = finalText.trim();
    if (t && S.screen === 'talk') { $('#text').value = ''; humanSays(S.ui.speaker, t); }
  };
  try { rec.start(); mic.rec = rec; mic.on = true; $('#mic')?.classList.add('on'); }
  catch { mic.blocked = true; const m = $('#mic'); if (m) m.hidden = true; }
}
function stopMic() { try { mic.rec?.stop(); } catch {} }

// --- 投票 ---
function renderVote() {
  const g = S.g;
  statusEl.textContent = g.voteRound > 1 ? '決選投票' : '投票';
  const runoff = g.voteRound > 1 ? `<p class="banner">同票だったので決選投票です。候補: ${g.candidates.map((id) => esc(P(id).name)).join('、')}</p>` : '';
  const voter = humans().find((h) => !g.votes[h.id]);
  if (!voter || S.ui.busy) {
    main.innerHTML = `<section class="panel cover"><h2>AIが投票しています</h2><p class="muted">それぞれが自分の推理だけで、別々に決めています。</p><div class="dots"><i></i><i></i><i></i></div></section>`;
    return;
  }
  if (humans().length > 1 && !S.ui.voteShown) {
    main.innerHTML = `<section class="panel cover">${runoff}<h2>${esc(voter.name)}さんの投票</h2><p>ほかの人は画面を見ないでください。</p><button class="btn moonlit big" type="button" id="open">投票する</button></section>`;
    $('#open').onclick = () => { S.ui.voteShown = true; render(); };
    return;
  }
  const opts = g.candidates.filter((id) => id !== voter.id).map(P);
  main.innerHTML = `<div class="stack"><section class="panel">${runoff}<h2>${esc(voter.name)}さん、ウルフだと思う人は？</h2>
    <div class="choices">${opts.map((p) => `<button class="choice" type="button" data-v="${p.id}" style="--c:${colorOf(p)}">${face(p)}<div><b>${esc(p.name)}</b><div class="muted">${p.type === 'human' ? '人間' : esc(PERSONALITIES[p.personality]?.label)}</div></div></button>`).join('')}</div></section>
    <details class="panel"><summary>会話を見返す</summary><div class="log" style="margin-top:10px">${logHtml()}</div></details></div>`;
  main.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => humanVote(voter.id, b.dataset.v));
}
function logHtml() {
  return S.g.log.map((l) => { const p = P(l.id); return `<div class="msg ${p.type}" style="--c:${colorOf(p)}">${face(p)}<div class="bubble"><div class="who">${esc(p.name)}</div>${esc(l.text)}</div></div>`; }).join('');
}

function renderGuess() {
  const w = P(S.g.wolfId);
  statusEl.textContent = '逆転のチャンス';
  main.innerHTML = `<section class="panel cover"><p>追放されたのは</p><div class="word" style="color:var(--wolf)">${esc(w.name)}</div>
    <p><b>${esc(w.name)}さんはウルフでした。</b></p>
    ${w.type === 'ai' || S.ui.busy ? `<p class="muted">${esc(w.name)}さんが多数派のお題を考えています…</p><div class="dots"><i></i><i></i><i></i></div>` : `
    <p class="muted">多数派のお題を当てれば逆転勝利です。</p>
    <form id="gf" class="row" style="justify-content:center;margin-top:12px"><input type="text" id="gtext" maxlength="20" placeholder="多数派のお題は？" style="max-width:240px"><button class="btn moonlit" type="submit">答える</button></form>`}
  </section>`;
  const f = $('#gf');
  if (f) f.onsubmit = (e) => { e.preventDefault(); const t = $('#gtext').value.trim(); if (t) resolveGuess(t); };
}

function bars(s) {
  return `<div class="bars">${Object.entries(s || {}).sort((a, b) => b[1] - a[1]).map(([id, v]) => { const p = P(id); return `<span>${esc(p?.name || id)}</span><div class="bar" style="--c:${p ? colorOf(p) : 'var(--mist-dim)'}"><i style="width:${Math.round(v * 100)}%"></i></div><span>${Math.round(v * 100)}%</span>`; }).join('')}</div>`;
}
function renderResult() {
  tts.stop();
  const g = S.g, r = g.result, w = P(g.wolfId);
  statusEl.textContent = 'ゲーム終了';
  const last = g.voteHistory[g.voteHistory.length - 1];
  const src = (t) => t.source === 'fallback' ? '<span class="chip">簡易AIで代行</span>' : t.source === 'offline' ? '<span class="chip">簡易AI</span>' : '';
  main.innerHTML = `<div class="stack">
    <section class="panel verdict ${r.winner}">
      <div class="muted">${r.winner === 'wolf' ? 'WOLF WINS' : 'VILLAGE WINS'}</div>
      <div class="big">${r.winner === 'wolf' ? 'ウルフの勝ち' : '村人の勝ち'}</div>
      <p style="margin:0 0 6px">${esc(r.reason)}</p>
      <p style="margin:0">ウルフは <span class="wolfmark">${esc(w.name)}</span>（お題「${esc(g.topic.minority)}」）。村人のお題は「${esc(g.topic.majority)}」でした。</p>
      ${r.guess ? `<p class="muted">ウルフの答え: 「${esc(r.guess.text)}」 ${r.guess.ok ? '正解' : '不正解'}${r.guess.reason ? `（${esc(r.guess.reason)}）` : ''}</p>` : ''}
    </section>
    <section class="panel"><h2>だれが、だれに投票したか${g.voteHistory.length > 1 ? '（決選投票）' : ''}</h2><div class="tbl"><table>
      <thead><tr><th>投票した人</th><th>投票先</th><th>理由</th></tr></thead><tbody>
      ${g.players.map((p) => { const v = last?.votes[p.id]; return v ? `<tr><td>${esc(p.name)}${p.id === g.wolfId ? ' <span class="wolfmark">ウルフ</span>' : ''}<div class="muted">${esc(p.word)}</div></td><td>${esc(P(v.target).name)}</td><td>${esc(v.reason || '—')}</td></tr>` : ''; }).join('')}
      </tbody></table></div></section>
    <section class="panel stack"><div><h2>AIたちの頭の中</h2><p class="muted" style="margin:0">ゲーム中は見えなかった「だれが怪しいか」の変化と、それぞれの作戦です。</p></div>
      ${ais().map((p, i) => `<details class="mind" ${i === 0 ? 'open' : ''} style="--c:${colorOf(p)}"><summary><b style="color:${colorOf(p)}">${esc(p.name)}</b> <span class="muted">${esc(PERSONALITIES[p.personality]?.label)}・${TIERS[p.tier] || ''}・お題「${esc(p.word)}」${p.id === g.wolfId ? '・ウルフ' : ''}</span></summary>
        ${(g.thoughts[p.id] || []).map((t) => `<div class="step"><div class="meta">${t.kind === 'vote' ? '投票のとき' : `${t.at + 1}番目の発言のとき`}${t.kind === 'speech' && t.source === 'claude' ? `・自分がウルフだと思う確率 ${Math.round((t.wolfSelf || 0) * 100)}%` : ''} ${src(t)}</div>${bars(t.suspicions)}${t.strategy ? `<div class="thought">${esc(t.strategy)}</div>` : ''}</div>`).join('')}
      </details>`).join('')}
    </section>
    <details class="panel"><summary>会話をぜんぶ見る</summary><div class="log" style="margin-top:10px">${logHtml()}</div></details>
    <div class="row" style="justify-content:center"><button class="btn moonlit big" type="button" id="again">同じ設定でもう一度</button><button class="btn big" type="button" id="back">設定に戻る</button></div>
  </div>`;
  main.scrollTo({ top: 0 });
  $('#again').onclick = () => { tts.unlock(); Object.assign(talk, { running: false, budget: 0, hint: null, speaking: Promise.resolve(), askedHuman: null }); S.g = newGame(); S.screen = 'reveal'; S.ui = { revealIdx: 0, shown: false, speaker: 'h1' }; render(); };
  $('#back').onclick = () => { S.screen = 'setup'; S.g = null; render(); };
}

// ===== 起動 =====
function start(saved) {
  if (saved && saved.S && saved.S.g && !['talk'].includes(saved.S.screen)) S = saved.S;
  else if (saved && saved.S && saved.S.g) { S = saved.S; S.ui.started = true; }
  render();
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    c.use('sample').then((fn) => { sample = fn || null; if (!sample) aiNotice = 'この画面ではClaudeを使えないため、簡易AIで遊びます。'; if (S.screen === 'setup') render(); else updateDock(); })
      .catch(() => { aiNotice = 'Claudeを使えないため、簡易AIで遊びます。'; });
  } else {
    aiNotice = 'この画面ではClaudeを使えないため、簡易AIで遊びます。';
    render();
  }
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
